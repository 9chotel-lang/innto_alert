name: innto check

on:
  workflow_dispatch:
    inputs:
      full_run:
        description: "Run full innto fetch flow (login/download/parse)"
        required: false
        default: "false"
  schedule:
    - cron: "*/30 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run check (preflight, manual green path)
        env:
          INNTO_HOTEL_ID: ${{ secrets.INNTO_HOTEL_ID }}
          INNTO_ACCOUNT: ${{ secrets.INNTO_ACCOUNT }}
          INNTO_PASSWORD: ${{ secrets.INNTO_PASSWORD }}
          WORKER_INGEST_URL: ${{ secrets.WORKER_INGEST_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: python scripts/run_check.py --preflight

      - name: Run check (full fetch)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.full_run == 'true' }}
        env:
          INNTO_HOTEL_ID: ${{ secrets.INNTO_HOTEL_ID }}
          INNTO_ACCOUNT: ${{ secrets.INNTO_ACCOUNT }}
          INNTO_PASSWORD: ${{ secrets.INNTO_PASSWORD }}
          REPORT_URL: ${{ secrets.REPORT_URL }}
          WORKER_INGEST_URL: ${{ secrets.WORKER_INGEST_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: python scripts/run_check.py
